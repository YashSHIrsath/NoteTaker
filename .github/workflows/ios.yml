name: iOS Build

# The counterpart to android.yml, and it works the same way: the native project is generated
# here from capacitor.config.ts and the web build rather than committed, and the result lands as
# a downloadable artifact.
#
# One difference that isn't a bug: this produces an *unsigned* build. Putting an app on a real
# iPhone needs an Apple signing identity, and there is none in this repo — see the archive step.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - 'vercel.json'
      - 'supabase/**'

jobs:
  ios:
    runs-on: macos-latest
    # Same reason as the Android job: the Supabase values are environment secrets, and a job only
    # receives those if it names the environment.
    environment: Production
    env:
      SCHEME: App
      ARCHIVE_PATH: ${{ github.workspace }}/build/App.xcarchive
    steps:
      - uses: actions/checkout@v4

      # Node 18 is what this job used to pin, and it's why the build died before it ever reached
      # Xcode: Vite 8 bundles with rolldown, which imports styleText from node:util — added in
      # Node 20.12. vite's own engines field says ^20.19 || >=22.12, so 22 it is, matching
      # android.yml.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fail here rather than shipping a build that can't connect: these are inlined at build
      # time, so an empty value is invisible until the app runs on a phone.
      - name: Check Supabase config is present
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "::error::VITE_SUPABASE_URL is empty. Add it as an Actions secret (repository, or in the environment this job names)."; exit 1; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo "::error::VITE_SUPABASE_ANON_KEY is empty. Add it as an Actions secret (repository, or in the environment this job names)."; exit 1; }
          echo "Supabase config present (URL is ${#VITE_SUPABASE_URL} chars, key is ${#VITE_SUPABASE_ANON_KEY} chars)."

      # build:native, not build — the native modes differ, and this is the script the APK job
      # uses too. Same three VITE_* values as the Vercel and Android builds.
      - name: Build web assets
        run: npm run build:native
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Without this the app's own origin (capacitor://localhost) ends up in confirmation
          # emails, which is not a link anyone can open.
          VITE_PUBLIC_APP_URL: ${{ secrets.VITE_PUBLIC_APP_URL }}

      # The native project is generated rather than committed, same as android.yml.
      #
      # Capacitor 8 lays this out with Swift Package Manager, not CocoaPods: the CLI hard-codes
      # ios-spm-template.tar.gz (see its dist/config.js), and that template ships App.xcodeproj
      # and CapApp-SPM — no Podfile and no App.xcworkspace anywhere in it. So there is no
      # `pod install` here to run or to wait for. Package resolution happens inside xcodebuild,
      # pulling capacitor-swift-pm from GitHub.
      #
      # The launcher icon is Capacitor's template default here; android.yml brands its own via
      # npm run android:icons, and there's no iOS equivalent script yet.
      - name: Generate iOS project
        run: |
          npx cap add ios
          npx cap sync ios

      # Which container xcodebuild is pointed at is decided by what `cap add` just produced,
      # rather than by an assumption written in this file.
      #
      # This job used to hard-code `-workspace ios/App/App.xcworkspace`, which under the SPM
      # layout is a path that never exists — so every run died at the archive step, on every
      # commit, with everything before it having gone fine. Capacitor's own build command chooses
      # the same way (dist/ios/build.js: `-workspace` under CocoaPods, `-project` under SPM), so
      # this follows the project on disk and keeps working if the template ever changes back.
      - name: Locate the Xcode project
        run: |
          set -euo pipefail
          if [ -d ios/App/App.xcworkspace ]; then
            echo "Found a CocoaPods workspace."
            echo "XCODE_CONTAINER_FLAG=-workspace" >> "$GITHUB_ENV"
            echo "XCODE_CONTAINER_PATH=ios/App/App.xcworkspace" >> "$GITHUB_ENV"
          elif [ -d ios/App/App.xcodeproj ]; then
            echo "Found an SPM project."
            echo "XCODE_CONTAINER_FLAG=-project" >> "$GITHUB_ENV"
            echo "XCODE_CONTAINER_PATH=ios/App/App.xcodeproj" >> "$GITHUB_ENV"
          else
            echo "::error::cap add ios produced neither ios/App/App.xcworkspace nor ios/App/App.xcodeproj."
            ls -la ios ios/App 2>/dev/null || true
            exit 1
          fi

      # Unsigned, deliberately. An archive for a device needs a certificate and a provisioning
      # profile, and this repo has neither, so asking xcodebuild to sign fails outright. Building
      # with signing off proves the app compiles and produces a .app to re-sign locally.
      #
      # To get an installable build instead: add the distribution certificate (.p12) and profile
      # as secrets, import them into a temporary keychain, drop the CODE_SIGNING_* overrides
      # below, and export with an exportOptions.plist naming your team and method.
      - name: Archive (unsigned)
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild archive \
            "$XCODE_CONTAINER_FLAG" "$XCODE_CONTAINER_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS=""

      # xcodebuild -exportArchive refuses to export without signing, so the IPA is assembled by
      # hand: an IPA is just a zip with the .app inside Payload/. This one installs nowhere as-is
      # — it's for signing yourself (Sideloadly, AltStore, or resigning in Xcode).
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find "$ARCHIVE_PATH/Products/Applications" -maxdepth 1 -name '*.app' | head -1)"
          test -n "$APP_PATH" || { echo "::error::No .app in the archive — the build produced nothing to package."; exit 1; }
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          (cd build && zip -qry Mindstack-unsigned.ipa Payload)
          rm -rf build/Payload
          ls -lh build/Mindstack-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: mindstack-ios-unsigned
          path: build/Mindstack-unsigned.ipa
          if-no-files-found: error
