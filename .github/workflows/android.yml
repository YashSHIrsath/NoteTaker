name: Android APK

# Run it by hand from the Actions tab (or by pushing a v* tag). The APK lands as a build
# artifact you download and install on the phone — nothing is served from a dev machine.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  apk:
    runs-on: ubuntu-latest
    # The Supabase values are stored as *environment* secrets, and a job only receives those if it
    # names the environment. Without this line `secrets.VITE_*` is empty and the APK builds with
    # no configuration — it installs and then can't reach the backend.
    environment: Production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fail here rather than shipping an APK that can't connect: these are inlined at build
      # time, so an empty value is invisible until the app runs on a phone.
      - name: Check Supabase config is present
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "::error::VITE_SUPABASE_URL is empty. Add it as an Actions secret (repository, or in the environment this job names)."; exit 1; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo "::error::VITE_SUPABASE_ANON_KEY is empty. Add it as an Actions secret (repository, or in the environment this job names)."; exit 1; }
          echo "Supabase config present (URL is ${#VITE_SUPABASE_URL} chars, key is ${#VITE_SUPABASE_ANON_KEY} chars)."

      # VITE_* values are read at build time, so they have to be present here — same two the
      # Vercel build uses.
      - name: Build web assets
        run: npm run build:native
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      # The native project is generated here rather than committed: it's fully derived from
      # capacitor.config.ts and the web build, and regenerating keeps a few hundred Gradle files
      # out of the repo. Add a platform-specific change (a permission, a native plugin) and this
      # is the step to replace with a committed android/ directory.
      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: mynotes-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
